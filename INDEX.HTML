<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دورة الإعلام الآلي</title>

```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        background: white;
        width: 100%;
        max-width: 500px;
        padding: 40px 30px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    }

    .icon {
        font-size: 55px;
        margin-bottom: 15px;
    }

    h1 {
        color: #1e293b;
        margin-bottom: 8px;
    }

    .teacher {
        color: #2563eb;
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    p {
        color: #64748b;
        margin-bottom: 30px;
        line-height: 1.8;
    }

    .btn {
        display: block;
        text-decoration: none;
        padding: 15px;
        margin: 15px 0;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        transition: 0.2s;
    }

    .pdf {
        background: #2563eb;
        color: white;
    }

    .html {
        background: #0f172a;
        color: white;
    }

    .btn:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }

    .footer {
        margin-top: 25px;
        font-size: 13px;
        color: #94a3b8;
    }
</style>
```

</head>

<body>

```
<div class="container">

    <div class="icon">💻</div>

    <h1>دورة الإعلام الآلي</h1>

    <div class="teacher">
        من تأطير الأستاذ بلوطي عمر
    </div>

    <p>
        مرحبًا بكم في فضاء الدورة<br>
        يمكنكم تحميل الدرس أو فتح المحتوى التفاعلي.
    </p>

    <a href="درس.pdf" class="btn pdf" download>
        📄 تحميل الدرس PDF
    </a>

    <a href="درس.html" class="btn html">
        🌐 فتح الدرس التفاعلي
    </a>

    <div class="footer">
        بالتوفيق للجميع 🌷
    </div>

</div>
```

</body>
</html>
