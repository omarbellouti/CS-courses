<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دورة الإعلام الآلي | الأستاذ بلوطي عمر</title>
    <!-- Google Fonts: Cairo & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.85);
            --primary-cyan: #00f2fe;
            --primary-blue: #4facfe;
            --accent-purple: #7d5fff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 242, 254, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(125, 95, 255, 0.1) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient glowing shapes */
        .glow-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,242,254,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulse 6s infinite alternate ease-in-out;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
        }

        .container {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 480px;
            padding: 45px 35px;
            border-radius: 28px;
            text-align: center;
            border: 1px solid var(--border-glow);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(0, 242, 254, 0.1),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(0, 242, 254, 0.2);
        }

        /* Tech Icon Badge */
        .icon-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(125, 95, 255, 0.1));
            border-radius: 22px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: var(--primary-cyan);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));
        }

        .badge {
            display: inline-block;
            background: rgba(0, 242, 254, 0.1);
            color: var(--primary-cyan);
            font-size: 13px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 50px;
            border: 1px solid rgba(0, 242, 254, 0.25);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .teacher {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .teacher .name {
            color: #ffffff;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.03);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Modern Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #040914;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.4);
            filter: brightness(1.08);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-cyan);
            transform: translateY(-3px);
            color: var(--primary-cyan);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease;
        }

        .btn:hover svg {
            transform: scale(1.15);
        }

        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer-code {
            font-family: 'Fira Code', monospace;
            color: var(--primary-cyan);
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="glow-orb"></div>

    <div class="container">
        
        <!-- Computer/Code SVG Icon -->
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
                <polyline points="7 8 10 11 7 14"></polyline>
                <line x1="13" y1="14" x2="17" y2="14"></line>
            </svg>
        </div>

        <span class="badge">منصة التعلم الرقمي</span>

        <h1>دورة الإعلام الآلي</h1>

        <div class="teacher">
            <span>تأطير:</span>
            <span class="name">الأستاذ بلوطي عمر</span>
        </div>

        <p class="description">
            مرحبًا بكم في فضاء الدورة التفاعلي.<br>
            يمكنكم الاطلاع على الدرس أو تحميل النسخة الرقمية مباشرة.
        </p>

        <div class="btn-group">
            <a href="درس.pdf" class="btn btn-primary" download>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                تحميل الدرس (PDF)
            </a>

            <a href="درس.html" class="btn btn-secondary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                فتح الدرس التفاعلي
            </a>
        </div>

        <div class="footer">
            <span class="footer-code">&lt;/&gt;</span>
            <span>نتمنى لكم توفيقاً ونجاحاً باهراً</span>
        </div>

    </div>

</body>
</html>
